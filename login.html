<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | MSU-MCEST AR Guide</title>
<script src="orientation-lock.js" defer></script>
<style>
:root {
  --text: #f8fafc;
  --muted: #cbd5e1;
  --line: rgba(255,255,255,.18);
  --panel: rgba(7, 15, 28, .78);
  --accent: #f97316;
  --green: #1fbf75;
  --red: #ef4444;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; font-family: "Segoe UI", Arial, sans-serif; color: var(--text); }
body {
  display: grid;
  place-items: center;
  padding: 22px;
  background:
    linear-gradient(135deg, rgba(31,191,117,.42), rgba(8,17,29,.72)),
    url("images/1background.png") center / cover fixed,
    #08111d;
}
.login {
  width: min(430px, 100%);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 26px;
  background: var(--panel);
  backdrop-filter: blur(16px);
  box-shadow: 0 22px 70px rgba(0,0,0,.34);
}
.eyebrow { margin: 0 0 8px; color: #fdba74; font-weight: 800; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
h1 { margin: 0; font-size: 34px; letter-spacing: 0; }
p { color: var(--muted); line-height: 1.45; margin: 10px 0 20px; }
.field { display: grid; gap: 7px; margin-bottom: 12px; }
label { color: var(--muted); font-size: 13px; }
input {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  min-height: 46px;
  padding: 10px 12px;
  color: var(--text);
  background: rgba(2,6,23,.62);
  outline: none;
}
input:focus { border-color: rgba(31,191,117,.8); }
.actions { display: grid; gap: 10px; margin-top: 16px; }
button, a {
  min-height: 46px;
  border: 1px solid var(--line);
  border-radius: 8px;
  display: grid;
  place-items: center;
  padding: 10px 12px;
  font: inherit;
  font-weight: 800;
  color: var(--text);
  text-decoration: none;
  background: rgba(255,255,255,.08);
  cursor: pointer;
}
button { background: var(--accent); color: #111827; border-color: transparent; }
.error {
  display: none;
  border: 1px solid rgba(239,68,68,.42);
  border-radius: 8px;
  padding: 10px;
  color: #fecaca;
  background: rgba(239,68,68,.13);
}
.error.active { display: block; }
.hint { margin-top: 14px; font-size: 12px; color: #dbeafe; }
</style>
</head>
<body>
<main class="login">
  <p class="eyebrow">Administrator</p>
  <h1>Log In</h1>
  <p>Enter the administrator account to manage building records, markers, and navigation data.</p>
  <div id="error" class="error">Invalid username or password.</div>
  <form id="loginForm">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="actions">
      <button type="submit">Log In</button>
      <a href="index.html">Back to Role Selection</a>
    </div>
  </form>
  <div class="hint">Default demo account: admin / admin123</div>
</main>

<script>
const ADMIN_USERNAME = "admin";
const ADMIN_PASSWORD = "admin123";
const API_LOGIN = "api/login.php";

if (sessionStorage.getItem("adminLoggedIn") === "true") {
  location.href = "admin.html";
}

document.getElementById("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  try {
    const response = await fetch(API_LOGIN, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await response.json();
    if (response.ok && data.ok) {
      sessionStorage.setItem("adminLoggedIn", "true");
      sessionStorage.setItem("adminUser", JSON.stringify(data.admin));
      location.href = "admin.html";
      return;
    }
  } catch (error) {
    // Static file fallback for local prototype viewing without PHP/MySQL.
  }
  if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
    sessionStorage.setItem("adminLoggedIn", "true");
    location.href = "admin.html";
    return;
  }
  document.getElementById("error").classList.add("active");
});
</script>
</body>
</html>
