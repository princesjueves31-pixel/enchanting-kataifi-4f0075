<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- IMPORTANT FOR MOBILE VIEW -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aki pinakagwapa sa tanan</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  height: 100%;
  font-family: "Segoe UI", Arial, sans-serif;
}

/* NAVBAR */
nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 60px;
  padding: 0 40px;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  z-index: 10;
  background: rgba(0, 0, 0, 0.25);
  backdrop-filter: blur(6px);
}

nav a {
  color: #fff;
  text-decoration: none;
  margin-left: 25px;
  padding: 8px 14px;
  border-radius: 6px;
}

/* BACKGROUND */
.slideshow {
  position: fixed;
  inset: 0;
  z-index: -2;
}

.slide {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transition: opacity 1.2s ease-in-out;
}

.slide.active {
  opacity: 1;
}

.overlay-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: -1;
}

/* CENTER LAYOUT */
body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: 60px;
}

/* CARD (DESKTOP DEFAULT) */
.selection-card {
  width: 360px;
  background: rgba(255,255,255,0.05);
  border-radius: 18px;
  padding: 45px 35px;
  text-align: center;
  backdrop-filter: blur(15px);
  border: 1px solid rgba(255,255,255,0.15);
}

.selection-card h2 {
  margin-bottom: 35px;
  font-size: 26px;
  color: #fff;
}

/* BUTTONS */
.selection-card a {
  display: block;
  width: 100%;
  padding: 14px 0;
  margin-bottom: 18px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 600;
  color: #fff;
  transition: 0.3s;
}

.selection-card a.admin {
  background: rgba(85, 107, 47, 0.8);
}

.selection-card a.admin:hover {
  background: rgba(59, 79, 32, 0.9);
}

.selection-card a.guest {
  background: rgba(160, 82, 45, 0.8);
}

.selection-card a.guest:hover {
  background: rgba(123, 63, 31, 0.9);
}

.footer-text {
  margin-top: 25px;
  font-size: 13px;
  color: #ddd;
}

/* ========================= */
/* 📱 MOBILE + TABLET FIX */
/* ========================= */

@media (max-width: 768px) {

  nav {
    justify-content: center;
    padding: 0;
  }

  nav a {
    margin-left: 10px;
    margin-right: 10px;
    font-size: 14px;
  }

  /* CARD FULL WIDTH ON MOBILE */
  .selection-card {
    width: 90%;
    padding: 25px;
  }

  .selection-card h2 {
    font-size: 20px;
  }

  .selection-card a {
    font-size: 15px;
    padding: 12px 0;
  }
}

</style>
</head>

<body>



<!-- BACKGROUND -->
<div class="slideshow">
  <div class="slide active" style="background-image:url('images/building1.jpg')"></div>
  <div class="slide" style="background-image:url('images/building2.jpg')"></div>
  <div class="slide" style="background-image:url('images/building3.jpg')"></div>
</div>

<div class="overlay-bg"></div>

<!-- CARD -->
<div class="selection-card">
  <h2>Select Access</h2>

  <a href="admin.html" class="admin">Administrator</a>
  <a href="student.html" class="guest">Student / Guest</a>

  <div class="footer-text">
    MSU-MCEST AR Campus Tour System
  </div>
</div>

<!-- SLIDESHOW -->
<script>
  const slides = document.querySelectorAll('.slide');
  let current = 0;

  setInterval(() => {
    slides[current].classList.remove('active');
    current = (current + 1) % slides.length;
    slides[current].classList.add('active');
  }, 3000);
</script>

</body>
</html>
