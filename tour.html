<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Campus</title>

<style>
body { margin:0; overflow:hidden; }
#info {
  position:fixed;
  top:10px;
  left:10px;
  background:rgba(0,0,0,0.6);
  color:white;
  padding:10px;
  font-family:Arial;
  z-index:10;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="info">Dynamic Campus Loading</div>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";

/* ================= SCENE ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeaf1f7);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 5000);
camera.position.set(0, 5, 10);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

/* ================= CONTROLS ================= */
const controls = new PointerLockControls(camera, document.body);
scene.add(controls.getObject());
document.addEventListener("click", () => controls.lock());

/* ================= LIGHT ================= */
scene.add(new THREE.HemisphereLight(0xffffff, 0xaaaaaa, 1));

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(50, 100, 50);
scene.add(sun);

/* ================= GROUND ================= */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 500),
  new THREE.MeshStandardMaterial({ color: 0xb0b0b0 })
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* ================= MOVEMENT ================= */
const keys = {};
document.addEventListener("keydown", e => keys[e.code] = true);
document.addEventListener("keyup", e => keys[e.code] = false);

function movePlayer(){
  const speed = 0.2;
  if(keys["KeyW"]) controls.moveForward(speed);
  if(keys["KeyS"]) controls.moveForward(-speed);
  if(keys["KeyA"]) controls.moveRight(-speed);
  if(keys["KeyD"]) controls.moveRight(speed);
}

/* ================= LOADERS ================= */
const loader = new GLTFLoader();
const loaded = {};

/* ================= BASE WORLD (STATIC) ================= */
loader.load("./models/overall.glb", (gltf) => {
  scene.add(gltf.scene);
  document.getElementById("info").innerHTML = "Base loaded ✔";
});

/* ================= DYNAMIC BUILDINGS ================= */
const buildings = [
  {
    name: "guardhouse",
    url: "./models/guardhouse.glb",
    position: { x: -35, z: 0 },
    range: 60
  },
  {
    name: "hallway",
    url: "./models/hallway.glb",
    position: { x: 35, z: 0 },
    range: 60
  }
];

function loadBuilding(b){
  if(loaded[b.name]) return;

  loader.load(b.url, (gltf) => {
    const model = gltf.scene;
    model.position.set(b.position.x, 0, b.position.z);
    scene.add(model);
    loaded[b.name] = model;
  });
}

function unloadBuilding(b){
  if(!loaded[b.name]) return;

  scene.remove(loaded[b.name]);
  delete loaded[b.name];
}

/* ================= DISTANCE CHECK ================= */
function update(player){
  buildings.forEach(b => {
    const dist = Math.hypot(
      player.x - b.position.x,
      player.z - b.position.z
    );

    if(dist < b.range) loadBuilding(b);
    else unloadBuilding(b);
  });
}

/* ================= LOOP ================= */
function animate(){
  requestAnimationFrame(animate);

  movePlayer();

  const pos = controls.getObject().position;
  update(pos);

  renderer.render(scene, camera);
}
animate();

/* ================= RESIZE ================= */
window.addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

</script>

</body>
</html>
