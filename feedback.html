<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback | MSU-MCEST AR Campus Guide</title>

<script src="orientation-lock.js" defer></script>
<script src="supabase-config.js"></script>

<style>
:root {
  --text: #f8fafc;
  --muted: #cbd5e1;
  --line: rgba(255,255,255,.18);
  --panel: rgba(7, 15, 28, .82);
  --accent: #f97316;
  --green: #1fbf75;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: Arial, sans-serif;
  color: var(--text);
  padding: 20px;
  background:
    linear-gradient(135deg, rgba(249,115,22,.34), rgba(8,17,29,.72)),
    url("images/2background.png") center/cover fixed;
}

.panel {
  width: min(560px, 100%);
  padding: 24px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
  backdrop-filter: blur(16px);
}

h1 { margin: 0; font-size: 32px; }

p { color: var(--muted); }

.field {
  margin-bottom: 12px;
  display: grid;
  gap: 6px;
}

input, select, textarea {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: rgba(2,6,23,.6);
  color: white;
}

textarea { min-height: 120px; }

button, a {
  display: grid;
  place-items: center;
  height: 46px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-weight: bold;
  text-decoration: none;
}

button {
  background: var(--accent);
  color: #111827;
}

a {
  background: rgba(255,255,255,.1);
  color: white;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 15px;
}

.message {
  margin-bottom: 10px;
  padding: 10px;
  border-radius: 8px;
  display: none;
  background: rgba(31,191,117,.15);
  border: 1px solid rgba(31,191,117,.4);
  color: #dcfce7;
}

.message.active { display: block; }

@media (max-width: 600px) {
  .actions { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<div class="panel">
  <h1>Send Feedback</h1>
  <p>Share your campus experience.</p>

  <div id="message" class="message"></div>

  <form id="feedbackForm">
    <div class="field">
      <label>Name</label>
      <input id="userName" placeholder="Guest">
    </div>

    <div class="field">
      <label>Building</label>
      <select id="buildingSelect"></select>
    </div>

    <div class="field">
      <label>Comment</label>
      <textarea id="comment" required></textarea>
    </div>

    <div class="actions">
      <button type="submit">Submit</button>
      <a href="student.html">Back</a>
    </div>
  </form>
</div>

<script>
const API_BUILDINGS = "api/buildings.php";
const SUPABASE_CONFIG = window.MSU_SUPABASE || {};

const fallbackBuildings = [
  { id: "", name: "General Feedback" },
  { id: "gate", name: "Main Gate / Entrance" },
  { id: "admin", name: "Administration Building" },
  { id: "dcs", name: "Department of Computer Science" },
  { id: "dhess", name: "Department of Humanities, Education, and Social Sciences" },
  { id: "secondary", name: "Secondary Department" },
  { id: "hotel", name: "Hotel Building" },
  { id: "halal", name: "Halal Center" },
  { id: "kitchen", name: "Kitchen Lab" },
  { id: "tesda", name: "TESDA Center" }
];

function showMessage(text) {
  const msg = document.getElementById("message");
  msg.textContent = text;
  msg.classList.add("active");
}

async function loadBuildings() {
  let buildings = fallbackBuildings;

  try {
    const res = await fetch(API_BUILDINGS);
    const data = await res.json();

    if (res.ok && data.ok && Array.isArray(data.buildings)) {
      buildings = [{ id: "", name: "General Feedback" }, ...data.buildings];
    }
  } catch (e) {}

  const select = document.getElementById("buildingSelect");
  select.innerHTML = "";

  buildings.forEach(b => {
    select.add(new Option(b.name, b.id));
  });
}

// ✅ SUPABASE ONLY
async function submitToSupabase(payload) {
  const url = SUPABASE_CONFIG.url;
  const key = SUPABASE_CONFIG.anonKey;

  if (!url || !key) {
    throw new Error("Supabase not configured");
  }

  const endpoint = `${url.replace(/\/$/, "")}/rest/v1/${SUPABASE_CONFIG.feedbackTable || "feedback"}`;

  const res = await fetch(endpoint, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": key,
      "Authorization": `Bearer ${key}`,
      "Prefer": "return=minimal"
    },
    body: JSON.stringify({
      user_name: payload.user_name,
      marker_id: payload.marker_id || null,
      comment: payload.comment,
      created_at: new Date().toISOString()
    })
  });

  if (!res.ok) {
    throw new Error(await res.text());
  }
}

document.getElementById("feedbackForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const payload = {
    user_name: document.getElementById("userName").value.trim() || "Guest",
    marker_id: document.getElementById("buildingSelect").value,
    comment: document.getElementById("comment").value.trim()
  };

  if (!payload.comment) {
    showMessage("Please enter a comment.");
    return;
  }

  try {
    await submitToSupabase(payload);
    document.getElementById("feedbackForm").reset();
    showMessage("Feedback submitted successfully!");
  } catch (err) {
    console.error(err);
    showMessage("Submission failed. Check Supabase setup.");
  }
});

loadBuildings();
</script>

</body>
</html>
