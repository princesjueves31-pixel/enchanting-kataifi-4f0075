<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- MOBILE RESPONSIVE FIX -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student / Guest | MSU-MCEST AR Tour</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* CARD */
.box {
  background: #1f2937;
  padding: 35px;
  width: 320px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

h1 {
  font-size: 20px;
  margin-bottom: 15px;
}

p {
  color: #9ca3af;
  font-size: 14px;
  margin-bottom: 20px;
}

/* BUTTONS */
a {
  display: block;
  margin: 10px 0;
  padding: 12px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
}

.start {
  background: #2563eb;
  color: white;
}

.start:hover {
  background: #1d4ed8;
}

.exit {
  background: crimson;
  color: white;
}

.exit:hover {
  background: darkred;
}

/* ===================== */
/* 📱 MOBILE RESPONSIVE */
/* ===================== */
@media (max-width: 768px){
  .box {
    width: 90%;
    padding: 25px;
  }

  h1 {
    font-size: 18px;
  }

  a {
    font-size: 14px;
    padding: 10px;
  }
}
</style>

</head>

<body>

<div class="box">

  <h1>MSU-MCEST AR Campus Tour</h1>

  <p>Welcome! Choose an action to continue.</p>

  <a href="tour.html" class="start">Start AR Tour</a>

  <!-- FIXED EXIT FLOW -->
  <a href="role_select.html" class="exit">Exit System</a>

</div>

</body>
</html>
