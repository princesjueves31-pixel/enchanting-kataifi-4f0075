<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student / Guest | MSU-MCEST AR Campus Guide</title>
<script src="orientation-lock.js" defer></script>
<style>
:root {
  --ink: #f8fafc;
  --muted: #cbd5e1;
  --line: rgba(255,255,255,.18);
  --panel: rgba(8, 19, 32, .72);
  --tour: #136f63;
  --nav: #d6512a;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; font-family: "Segoe UI", Arial, sans-serif; color: var(--ink); }
body { display: grid; place-items: center; padding: 28px; background: #09111d; }
.slides, .slides::after { position: fixed; inset: 0; z-index: -2; }
.slides::after { content: ""; z-index: 1; background: linear-gradient(90deg, rgba(4,9,16,.84), rgba(4,9,16,.46)); }
.slide {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transition: opacity 900ms ease;
}
.slide.active { opacity: 1; }
main { width: min(920px, 100%); }
.brand { margin-bottom: 28px; }
.brand p { margin: 0 0 8px; color: var(--muted); font-weight: 700; letter-spacing: .08em; font-size: 12px; text-transform: uppercase; }
h1 { margin: 0; max-width: 720px; font-size: clamp(34px, 7vw, 72px); line-height: .96; letter-spacing: 0; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.choice {
  min-height: 180px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 22px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  color: var(--ink);
  text-decoration: none;
  background: var(--panel);
  backdrop-filter: blur(12px);
}
.choice strong { font-size: 25px; }
.choice span { color: var(--muted); line-height: 1.45; margin-top: 10px; display: block; }
.choice b {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 28px;
  align-self: flex-end;
}
.tour b { background: var(--tour); }
.nav b { background: var(--nav); }
.link {
  display: inline-block;
  margin-top: 18px;
  margin-right: 18px;
  color: var(--muted);
  text-decoration: none;
  border-bottom: 1px solid rgba(203,213,225,.5);
}
@media (max-width: 700px) {
  body { place-items: end center; padding: 18px; }
  .choices { grid-template-columns: 1fr; }
  .choice { min-height: 142px; }
}
</style>
</head>
<body>
<div class="slides" aria-hidden="true">
  <div class="slide active" style="background-image:url('images/1background.png')"></div>
  <div class="slide" style="background-image:url('images/2background.png')"></div>
  <div class="slide" style="background-image:url('images/3background.png')"></div>
  <div class="slide" style="background-image:url('images/4background.png')"></div>
  <div class="slide" style="background-image:url('images/5background.png')"></div>
  <div class="slide" style="background-image:url('images/6background.png')"></div>
</div>

<main>
  <section class="brand">
    <p>Student / Guest</p>
    <h1>Choose how you want to explore the campus.</h1>
  </section>

  <section class="choices" aria-label="Campus guide modes">
    <a class="choice tour" href="tour.html">
      <div>
        <strong>Campus Tour</strong>
        <span>Open the 3D campus viewer and explore the school model.</span>
      </div>
      <b aria-hidden="true">></b>
    </a>

    <a class="choice nav" href="navigation.html">
      <div>
        <strong>Navigation</strong>
        <span>Scan a starting building, choose a destination, and follow one AR direction arrow.</span>
      </div>
      <b aria-hidden="true">></b>
    </a>
  </section>

  <a class="link" href="markers.html">Building Markers</a>
  <a class="link" href="feedback.html">Send Feedback</a>
  <a class="link" href="index.html">Log Out</a>
</main>

<script>
const slides = document.querySelectorAll(".slide");
let current = 0;
setInterval(() => {
  slides[current].classList.remove("active");
  current = (current + 1) % slides.length;
  slides[current].classList.add("active");
}, 3200);
</script>
</body>
</html>
